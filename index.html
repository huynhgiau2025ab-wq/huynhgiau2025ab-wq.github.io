<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thuê Xe Bình Dương | Nhà Xe Gia Bảo</title>
<meta name="description" content="Nhà Xe Gia Bảo cho thuê xe 4, 7, 16, 29 chỗ có lái tại Bình Dương, TP.HCM và các tỉnh miền Nam. Đưa đón sân bay, du lịch, công tác, đi tỉnh.">
<link rel="stylesheet" href="style.css">
<style>
.image-card{overflow:hidden;padding-top:0}.image-card>img{width:100%;height:190px;object-fit:cover;display:block}.image-card h3,.image-card p,.image-card .more,.image-card .pill-btn{margin-left:24px;margin-right:24px}.image-card h3{margin-top:20px}.image-card p{min-height:48px}.route-photo-img{width:100%;height:150px;object-fit:cover;display:block}.route-card{overflow:hidden}
</style>
<style>
footer{
  background:#10213b;
  color:#fff;
  margin-top:0;
}
.footer-inner{
  max-width:1300px;
  margin:auto;
  padding:38px 15px 25px;
  display:grid;
  grid-template-columns:1.35fr 1fr 1fr 1.15fr;
  gap:30px;
  color:#fff;
}
.footer-brand img{
  width:86px;
  height:86px;
  border-radius:50%;
  object-fit:cover;
  border:3px solid #fff;
  background:#fff;
  display:block;
  margin-bottom:12px;
}
.footer-brand h3,.footer-col h3{
  margin:0 0 10px;
}
.footer-brand p,.footer-col p{
  margin:7px 0;
  line-height:1.55;
}
.footer-map-title{
  font-weight:800;
  margin:18px 0 10px;
}
.footer-brand iframe{
  width:100%;
  max-width:430px;
  height:190px;
  border:0;
  border-radius:14px;
  display:block;
}
.footer-copy{
  grid-column:1/-1;
  border-top:1px solid rgba(255,255,255,.2);
  padding-top:18px;
  text-align:center;
  color:#d7e1ee;
}
@media(max-width:1000px){
  .footer-inner{grid-template-columns:1fr 1fr;}
}
@media(max-width:800px){
  .footer-inner{grid-template-columns:1fr;}
  .footer-copy{grid-column:auto;}
}
</style>

.fixed-contact-bar {

    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    gap: 10px;
    z-index: 9999;
}
.contact-btn {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 26px;
    text-decoration: none;
    box-shadow: 0 3px 10px rgba(0,0,0,0.25);

.contact-btn:hover { transform: scale(1.15); }
.btn-fb    { background: #1877F2; }

.btn-zalo  { background: #0091FF; }
